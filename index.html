<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>IndyBooks - Podcast & Audiobook Hub</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="IndyBooks">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        sky: '#C3D7EA',
                        captain: '#4173B0',
                        navy: '#2B4C6D',
                        rose: '#EABCB5',
                        poppy: '#EB8861',
                        sunshine: '#EDCE7A',
                        indyBg: '#F7F9FC',
                        indyCard: '#FFFFFF',
                        indyDarkBg: '#182430',
                        indyDarkCard: '#243447',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(65, 115, 176, 0.3); border-radius: 2px; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #4173B0;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .safe-bottom { padding-bottom: max(env(safe-area-inset-bottom, 1rem), 0.75rem); }
        .safe-top { padding-top: max(env(safe-area-inset-bottom, 1rem), 0.75rem); }
    </style>
</head>
<body class="bg-indyBg dark:bg-indyDarkBg text-gray-900 dark:text-gray-100 h-[100dvh] flex flex-col overflow-hidden select-none">

    <header class="bg-white/90 dark:bg-indyDarkCard/90 backdrop-blur-xl border-b border-gray-200/80 dark:border-gray-700/60 px-4 py-3.5 flex items-center justify-between z-20 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="w-11 h-11 bg-gradient-to-tr from-[#4173B0] to-[#C3D7EA] rounded-2xl flex items-center justify-center text-white shadow-md shadow-[#4173B0]/20 p-1">
                <svg viewBox="0 0 100 100" class="w-full h-full fill-white drop-shadow-sm">
                    <path d="M50 15 C35 15, 28 30, 25 45 C22 60, 20 85, 30 90 C38 93, 45 80, 50 85 C55 80, 62 93, 70 90 C80 85, 78 60, 75 45 C72 30, 65 15, 50 15 Z" fill="#ffffff" opacity="0.95"/>
                    <ellipse cx="50" cy="52" rx="14" ry="10" fill="#C3D7EA"/>
                    <circle cx="50" cy="48" r="4.5" fill="#2B4C6D"/>
                    <circle cx="40" cy="38" r="3.5" fill="#2B4C6D"/>
                    <circle cx="60" cy="38" r="3.5" fill="#2B4C6D"/>
                    <path d="M30 30 Q20 25 25 35 Z" fill="#ffffff"/>
                    <path d="M70 30 Q80 25 75 35 Z" fill="#ffffff"/>
                </svg>
            </div>
            <div>
                <h1 class="font-bold text-base sm:text-lg leading-tight tracking-tight text-[#2B4C6D] dark:text-white">IndyBooks</h1>
                <p class="text-[11px] text-[#4173B0] font-medium">Podcasts & Audiobooks</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="toggleMobileSidebar()" class="md:hidden p-2.5 bg-gray-100 dark:bg-gray-800 active:bg-gray-200 rounded-xl text-gray-700 dark:text-gray-300 text-sm transition" aria-label="Toggle Menu">
                <i class="fa-solid fa-bars"></i>
            </button>
            <button onclick="openFolderModal()" class="p-2.5 sm:px-3.5 sm:py-2 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-xl text-xs font-semibold transition flex items-center space-x-1.5" title="New Folder">
                <i class="fa-solid fa-folder-plus text-[#4173B0]"></i>
                <span class="hidden sm:inline">Folder</span>
            </button>
            <button onclick="openAddFeedModal()" class="px-3.5 py-2 bg-[#4173B0] hover:bg-[#2B4C6D] text-white rounded-xl text-xs font-semibold transition flex items-center space-x-1.5 shadow-md shadow-[#4173B0]/20 active:scale-95">
                <i class="fa-solid fa-rss"></i>
                <span class="hidden sm:inline">RSS Feed</span>
            </button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden relative">
        <div id="mobileSidebarOverlay" onclick="toggleMobileSidebar()" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-30 hidden md:hidden transition-opacity"></div>

        <aside id="sidebarNav" class="absolute md:relative inset-y-0 left-0 w-80 md:w-64 bg-white/95 dark:bg-indyDarkCard/95 backdrop-blur-2xl border-r border-gray-200/80 dark:border-gray-700/60 flex flex-col z-40 transform -translate-x-full md:translate-x-0 transition-transform duration-300 shrink-0 shadow-2xl md:shadow-none">
            <div class="p-4 flex items-center justify-between md:hidden border-b border-gray-200 dark:border-gray-700">
                <span class="font-bold text-base flex items-center space-x-2 text-[#2B4C6D] dark:text-white">
                    <i class="fa-solid fa-compass text-[#4173B0]"></i>
                    <span>Library Navigation</span>
                </span>
                <button onclick="toggleMobileSidebar()" class="p-2 text-gray-500 hover:text-gray-900 dark:hover:text-white rounded-xl bg-gray-100 dark:bg-gray-800"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-4 space-y-1.5 overflow-y-auto flex-1">
                <div class="text-[11px] font-bold text-[#4173B0] px-3 pb-1 uppercase tracking-wider">Library View</div>
                <button onclick="filterView('all'); toggleMobileSidebarIfNeeded();" id="nav-all" class="w-full flex items-center space-x-3 px-3 py-3 rounded-2xl text-sm font-semibold bg-[#4173B0]/15 text-[#2B4C6D] dark:text-sky transition active:scale-[0.98]">
                    <i class="fa-solid fa-layer-group w-5 text-center text-base"></i>
                    <span>All Items</span>
                </button>
                <button onclick="filterView('podcasts'); toggleMobileSidebarIfNeeded();" id="nav-podcasts" class="w-full flex items-center space-x-3 px-3 py-3 rounded-2xl text-sm font-semibold text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800/60 transition active:scale-[0.98]">
                    <i class="fa-solid fa-podcast w-5 text-center text-base"></i>
                    <span>Podcasts</span>
                </button>
                <button onclick="filterView('audiobooks'); toggleMobileSidebarIfNeeded();" id="nav-audiobooks" class="w-full flex items-center space-x-3 px-3 py-3 rounded-2xl text-sm font-semibold text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800/60 transition active:scale-[0.98]">
                    <i class="fa-solid fa-book-open w-5 text-center text-base"></i>
                    <span>Audiobooks</span>
                </button>

                <div class="pt-5 pb-1 px-3 text-[11px] font-bold text-[#4173B0] uppercase tracking-wider flex items-center justify-between">
                    <span>Folders</span>
                    <button onclick="openFolderModal()" class="text-[#4173B0] hover:text-[#2B4C6D] text-xs font-semibold"><i class="fa-solid fa-plus"></i> New</button>
                </div>
                <div id="sidebar-folders" class="space-y-1"></div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col bg-[#F7F9FC] dark:bg-[#182430] overflow-hidden">
            <div class="p-3.5 sm:p-5 border-b border-gray-200/80 dark:border-gray-700/60 flex items-center justify-between gap-3 bg-white/40 dark:bg-indyDarkCard/40 backdrop-blur-md shrink-0">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                    <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="Search podcasts, audiobooks..." class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-[#4173B0] shadow-sm transition">
                </div>
                <div>
                    <label class="px-4 py-2.5 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 rounded-2xl text-xs font-semibold cursor-pointer transition flex items-center space-x-2 shadow-sm shrink-0 active:scale-95 text-[#2B4C6D] dark:text-gray-200">
                        <i class="fa-solid fa-cloud-arrow-up text-[#4173B0] text-sm"></i>
                        <span class="hidden sm:inline">Upload Audio</span>
                        <input type="file" id="localAudioUpload" accept="audio/*,.mp3,.m4a,.m4b,.aac,.wav,.ogg,.flac,audio/mp4,audio/x-m4b,audio/aac,application/octet-stream" class="hidden" onchange="handleLocalUpload(event)">
                    </label>
                </div>
            </div>

            <div id="itemsContainer" class="flex-1 overflow-y-auto p-4 sm:p-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 content-start"></div>
        </main>
    </div>

    <div id="playerBar" class="bg-white/95 dark:bg-indyDarkCard/95 backdrop-blur-2xl border-t border-gray-200/80 dark:border-gray-700/60 px-4 py-3.5 flex flex-col gap-3 z-30 shrink-0 shadow-2xl safe-bottom">
        <div class="flex items-center justify-between gap-3">
            <div class="flex items-center space-x-3.5 overflow-hidden flex-1 cursor-pointer group" onclick="openPlayerDetailModal()">
                <img id="currentCover" src="https://placehold.co/60x60/4173B0/ffffff?text=Indy" alt="Cover" class="w-13 h-13 rounded-2xl object-cover shadow-md bg-gray-200 dark:bg-gray-800 shrink-0 group-hover:scale-105 transition" onerror="this.src='https://placehold.co/60x60/4173B0/ffffff?text=Indy'">
                <div class="overflow-hidden flex-1">
                    <h4 id="currentTitle" class="font-bold text-xs sm:text-sm truncate text-[#2B4C6D] dark:text-white">No Audio Selected</h4>
                    <p id="currentSubtitle" class="text-[11px] text-[#4173B0] truncate font-medium">Tap library to start listening</p>
                </div>
            </div>

            <div class="flex items-center space-x-2 shrink-0">
                <button onclick="skipTime(-15)" class="w-10 h-10 flex items-center justify-center text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-full transition text-sm active:scale-95" title="Rewind 15s"><i class="fa-solid fa-rotate-left"></i></button>
                <button onclick="togglePlayPause()" id="playPauseBtn" class="w-12 h-12 bg-[#4173B0] hover:bg-[#2B4C6D] text-white rounded-full flex items-center justify-center shadow-lg shadow-[#4173B0]/30 transition transform active:scale-90 disabled:opacity-40" disabled><i class="fa-solid fa-play text-base ml-0.5"></i></button>
                <button onclick="skipTime(30)" class="w-10 h-10 flex items-center justify-center text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-full transition text-sm active:scale-95" title="Forward 30s"><i class="fa-solid fa-rotate-right"></i></button>
            </div>
        </div>

        <div class="w-full flex items-center space-x-3 text-xs text-gray-500 px-1">
            <span id="currentTimeDisplay" class="w-11 text-right font-medium">0:00</span>
            <input type="range" id="seekSlider" value="0" min="0" max="100" step="0.1" oninput="seekAudio(this.value)" class="flex-1 h-2.5 bg-gray-200 dark:bg-gray-700 rounded-lg appearance-none cursor-pointer slider-thumb accent-[#4173B0] shadow-inner">
            <span id="durationDisplay" class="w-11 font-medium">0:00</span>
        </div>

        <div class="flex items-center justify-between pt-2 border-t border-gray-100 dark:border-gray-800/80 px-1">
            <div class="flex items-center space-x-2">
                <div class="flex items-center bg-gray-100 dark:bg-gray-800/90 rounded-xl px-2.5 py-1.5 space-x-2 shadow-sm">
                    <span class="text-[10px] font-bold text-[#4173B0] tracking-wider">SPEED</span>
                    <button onclick="adjustFileSpeed(-0.1)" class="w-7 h-7 flex items-center justify-center text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-lg transition text-xs active:scale-95"><i class="fa-solid fa-minus"></i></button>
                    <span id="fileSpeedDisplay" class="text-xs font-bold w-10 text-center text-[#4173B0]">1.0x</span>
                    <button onclick="adjustFileSpeed(0.1)" class="w-7 h-7 flex items-center justify-center text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-lg transition text-xs active:scale-95"><i class="fa-solid fa-plus"></i></button>
                </div>
                <button onclick="toggleSlothMode()" id="slothModeBtn" class="px-3 py-1.5 bg-[#EABCB5]/40 hover:bg-[#EABCB5]/70 text-[#2B4C6D] dark:text-white rounded-xl text-xs font-bold transition flex items-center space-x-1.5 shadow-sm border border-[#EABCB5] active:scale-95" title="Sloth Mode (0.5x)">
                    <i class="fa-solid fa-paw text-[#EB8861]"></i>
                    <span class="hidden sm:inline">Sloth Mode</span>
                </button>
            </div>

            <div class="flex items-center space-x-2.5">
                <button onclick="openSleepModal()" id="sleepTimerBtn" class="p-2.5 bg-gray-100 dark:bg-gray-800/90 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-xl text-xs font-semibold transition text-gray-700 dark:text-gray-300 relative shadow-sm" title="Sleep Timer">
                    <i class="fa-solid fa-moon text-sm"></i>
                    <span id="sleepBadge" class="absolute -top-1 -right-1 bg-[#EB8861] text-white text-[9px] font-bold px-1.5 py-0.2 rounded-full hidden shadow">0m</span>
                </button>
                <button onclick="openBookmarksModal()" class="p-2.5 bg-gray-100 dark:bg-gray-800/90 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-xl text-xs font-semibold transition text-gray-700 dark:text-gray-300 shadow-sm" title="Bookmarks">
                    <i class="fa-solid fa-bookmark text-sm"></i>
                </button>
                <button onclick="addCurrentBookmark()" class="px-3.5 py-2 bg-[#4173B0]/15 hover:bg-[#4173B0]/25 text-[#2B4C6D] dark:text-sky rounded-xl text-xs font-bold transition flex items-center space-x-1.5 active:scale-95 shadow-sm">
                    <i class="fa-solid fa-plus text-[10px]"></i>
                    <span>Bookmark</span>
                </button>
            </div>
        </div>
    </div>

    <audio id="audioPlayer" ontimeupdate="updateAudioProgress()" onended="handleAudioEnded()" onloadedmetadata="handleMetadataLoaded()"></audio>

    <div id="rssModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white dark:bg-indyDarkCard w-full max-w-md rounded-2xl shadow-2xl overflow-hidden border border-gray-200 dark:border-gray-700">
            <div class="p-5 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
                <h3 class="font-semibold text-lg text-[#2B4C6D] dark:text-white">Ingest Podcast RSS Feed</h3>
                <button onclick="closeAddFeedModal()" class="text-gray-400 hover:text-gray-900 dark:hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-5 space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">RSS Feed URL</label>
                    <input type="url" id="rssUrlInput" placeholder="https://example.com/podcast/rss.xml" class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#4173B0]">
                </div>
            </div>
            <div class="p-4 bg-gray-50 dark:bg-gray-900 border-t border-gray-200 dark:border-gray-700 flex justify-end space-x-2">
                <button onclick="closeAddFeedModal()" class="px-4 py-2 bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 rounded-xl text-xs font-medium transition">Cancel</button>
                <button onclick="submitRssFeed()" class="px-4 py-2 bg-[#4173B0] hover:bg-[#2B4C6D] text-white rounded-xl text-xs font-medium transition shadow-sm">Ingest Feed</button>
            </div>
        </div>
    </div>

    <div id="editModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white dark:bg-indyDarkCard w-full max-w-md rounded-2xl shadow-2xl overflow-hidden border border-gray-200 dark:border-gray-700">
            <div class="p-5 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
                <h3 class="font-semibold text-lg text-[#2B4C6D] dark:text-white">Edit Audio Details</h3>
                <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-900 dark:hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-5 space-y-4">
                <input type="hidden" id="editItemId">
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">Title</label>
                    <input type="text" id="editTitleInput" class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#4173B0]">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">Cover Image URL</label>
                    <input type="url" id="editCoverInput" placeholder="https://..." class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#4173B0]">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">Folder Grouping</label>
                    <select id="editFolderSelect" class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#4173B0]">
                        <option value="">No Folder (Unassigned)</option>
                    </select>
                </div>
            </div>
            <div class="p-4 bg-gray-50 dark:bg-gray-900 border-t border-gray-200 dark:border-gray-700 flex justify-end space-x-2">
                <button onclick="closeEditModal()" class="px-4 py-2 bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 rounded-xl text-xs font-medium transition">Cancel</button>
                <button onclick="saveItemEdits()" class="px-4 py-2 bg-[#4173B0] hover:bg-[#2B4C6D] text-white rounded-xl text-xs font-medium transition shadow-sm">Save Changes</button>
            </div>
        </div>
    </div>

    <div id="folderModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white dark:bg-indyDarkCard w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden border border-gray-200 dark:border-gray-700">
            <div class="p-5 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
                <h3 class="font-semibold text-lg text-[#2B4C6D] dark:text-white">Create New Folder</h3>
                <button onclick="closeFolderModal()" class="text-gray-400 hover:text-gray-900 dark:hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-5 space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">Folder Name</label>
                    <input type="text" id="newFolderNameInput" placeholder="e.g., Indy's Favorites" class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#4173B0]">
                </div>
            </div>
            <div class="p-4 bg-gray-50 dark:bg-gray-900 border-t border-gray-200 dark:border-gray-700 flex justify-end space-x-2">
                <button onclick="closeFolderModal()" class="px-4 py-2 bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 rounded-xl text-xs font-medium transition">Cancel</button>
                <button onclick="createNewFolder()" class="px-4 py-2 bg-[#4173B0] hover:bg-[#2B4C6D] text-white rounded-xl text-xs font-medium transition shadow-sm">Create</button>
            </div>
        </div>
    </div>

    <div id="sleepModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white dark:bg-indyDarkCard w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden border border-gray-200 dark:border-gray-700">
            <div class="p-5 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
                <h3 class="font-semibold text-lg text-[#2B4C6D] dark:text-white">Sleep Timer</h3>
                <button onclick="closeSleepModal()" class="text-gray-400 hover:text-gray-900 dark:hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-5 space-y-3">
                <button onclick="setSleepTimer(15)" class="w-full py-3 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-xl text-sm font-medium transition text-left px-4 flex items-center justify-between"><span>15 Minutes</span><i class="fa-solid fa-chevron-right text-xs text-gray-400"></i></button>
                <button onclick="setSleepTimer(30)" class="w-full py-3 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-xl text-sm font-medium transition text-left px-4 flex items-center justify-between"><span>30 Minutes</span><i class="fa-solid fa-chevron-right text-xs text-gray-400"></i></button>
                <button onclick="setSleepTimer(60)" class="w-full py-3 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-xl text-sm font-medium transition text-left px-4 flex items-center justify-between"><span>1 Hour</span><i class="fa-solid fa-chevron-right text-xs text-gray-400"></i></button>
                <button onclick="setSleepTimer(0)" class="w-full py-3 bg-red-500/10 hover:bg-red-500/20 text-red-600 rounded-xl text-sm font-medium transition text-left px-4">Turn Off Timer</button>
            </div>
        </div>
    </div>

    <div id="bookmarksModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white dark:bg-indyDarkCard w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden border border-gray-200 dark:border-gray-700 flex flex-col max-h-[80vh]">
            <div class="p-5 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between shrink-0">
                <h3 class="font-semibold text-lg text-[#2B4C6D] dark:text-white">Item Bookmarks</h3>
                <button onclick="closeBookmarksModal()" class="text-gray-400 hover:text-gray-900 dark:hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="bookmarksList" class="p-5 space-y-3 overflow-y-auto flex-1"></div>
        </div>
    </div>

    <script>
        let appData = JSON.parse(localStorage.getItem('indybooks_app_data')) || {
            items: [
                {
                    id: 'item-1',
                    title: 'Indy & The Great AI Revolution Explained',
                    type: 'podcast',
                    audioUrl: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3',
                    coverUrl: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300',
                    folder: 'Indy Tech',
                    currentTime: 0,
                    duration: 0,
                    speed: 1.0,
                    bookmarks: []
                },
                {
                    id: 'item-2',
                    title: 'Project Hail Mary - Audiobook Ch. 1',
                    type: 'audiobook',
                    audioUrl: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3',
                    coverUrl: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=300',
                    folder: 'Audiobooks',
                    currentTime: 0,
                    duration: 0,
                    speed: 1.2,
                    bookmarks: []
                }
            ],
            folders: ['Indy Tech', 'Audiobooks'],
            currentTrackId: null,
            filter: 'all',
            activeFolder: null,
            searchQuery: ''
        };

        let sleepTimerInterval = null;
        let sleepTimeRemaining = 0;
        const audioElement = document.getElementById('audioPlayer');

        function saveAppData() {
            localStorage.setItem('indybooks_app_data', JSON.stringify(appData));
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderFolders();
            renderItems();
            updateFolderDropdowns();
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed:', err));
            }
        });

        function toggleMobileSidebar() {
            document.getElementById('sidebarNav').classList.toggle('-translate-x-full');
            document.getElementById('mobileSidebarOverlay').classList.toggle('hidden');
        }

        function toggleMobileSidebarIfNeeded() {
            if (window.innerWidth < 768) toggleMobileSidebar();
        }

        function renderFolders() {
            const container = document.getElementById('sidebar-folders');
            container.innerHTML = appData.folders.map(folder => `
                <button onclick="filterFolder('${folder}'); toggleMobileSidebarIfNeeded();" id="folder-${folder}" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800/60 transition">
                    <div class="flex items-center space-x-3 truncate">
                        <i class="fa-solid fa-folder text-[#EB8861] w-5 text-center"></i>
                        <span class="truncate">${folder}</span>
                    </div>
                    <span class="text-xs text-gray-400">${appData.items.filter(i => i.folder === folder).length}</span>
                </button>
            `).join('');
        }

        function updateFolderDropdowns() {
            const select = document.getElementById('editFolderSelect');
            select.innerHTML = '<option value="">No Folder (Unassigned)</option>' + 
                appData.folders.map(f => `<option value="${f}">${f}</option>`).join('');
        }

        function filterView(type) {
            appData.filter = type;
            appData.activeFolder = null;
            document.querySelectorAll('aside button').forEach(b => b.classList.remove('bg-[#4173B0]/15', 'text-[#2B4C6D]', 'dark:text-sky'));
            const btn = document.getElementById(`nav-${type}`);
            if(btn) btn.classList.add('bg-[#4173B0]/15', 'text-[#2B4C6D]', 'dark:text-sky');
            renderItems();
        }

        function filterFolder(folderName) {
            appData.activeFolder = folderName;
            appData.filter = 'folder';
            document.querySelectorAll('aside button').forEach(b => b.classList.remove('bg-[#4173B0]/15', 'text-[#2B4C6D]', 'dark:text-sky'));
            const el = document.getElementById(`folder-${folderName}`);
            if(el) el.classList.add('bg-[#4173B0]/15', 'text-[#2B4C6D]', 'dark:text-sky');
            renderItems();
        }

        function handleSearch(query) {
            appData.searchQuery = query.toLowerCase();
            renderItems();
        }

        function renderItems() {
            const container = document.getElementById('itemsContainer');
            let filtered = appData.items.filter(item => {
                if (appData.searchQuery && !item.title.toLowerCase().includes(appData.searchQuery)) return false;
                if (appData.filter === 'podcasts') return item.type === 'podcast';
                if (appData.filter === 'audiobooks') return item.type === 'audiobook';
                if (appData.filter === 'folder') return item.folder === appData.activeFolder;
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-16 text-center text-gray-400">
                        <i class="fa-solid fa-box-open text-4xl mb-3 opacity-40"></i>
                        <p class="text-base font-medium">No items found</p>
                        <p class="text-xs">Ingest an RSS feed or upload local audio files to get started.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(item => {
                const duration = item.duration || 1;
                const percent = Math.min(100, Math.max(0, (item.currentTime / duration) * 100));
                const remaining = Math.max(0, duration - item.currentTime);
                const isPlaying = appData.currentTrackId === item.id && !audioElement.paused;

                return `
                    <div class="bg-white dark:bg-indyDarkCard border border-gray-200 dark:border-gray-700/60 rounded-2xl p-4 flex flex-col justify-between shadow-sm hover:shadow-md transition group">
                        <div>
                            <div class="relative aspect-square rounded-xl overflow-hidden mb-3 bg-gray-100 dark:bg-gray-800 shadow-inner">
                                <img src="${item.coverUrl}" alt="Cover" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://placehold.co/300x300/4173B0/ffffff?text=Indy'">
                                <button onclick="playItem('${item.id}')" class="absolute inset-0 bg-black/30 backdrop-blur-[2px] opacity-0 group-hover:opacity-100 md:opacity-0 active:opacity-100 transition flex items-center justify-center text-white text-2xl">
                                    <i class="fa-solid ${isPlaying ? 'fa-pause' : 'fa-play'} drop-shadow-md"></i>
                                </button>
                                ${item.folder ? `<span class="absolute top-2 left-2 px-2 py-0.5 bg-[#2B4C6D]/80 backdrop-blur-md text-white text-[10px] font-medium rounded-md">${item.folder}</span>` : ''}
                            </div>
                            <h3 class="font-semibold text-sm line-clamp-2 text-[#2B4C6D] dark:text-white mb-1" title="${item.title}">${item.title}</h3>
                            <p class="text-xs text-gray-500 dark:text-gray-400 capitalize">${item.type} • Speed: ${item.speed}x</p>
                        </div>

                        <div class="mt-4 pt-3 border-t border-gray-100 dark:border-gray-800 space-y-2">
                            <div class="space-y-1">
                                <div class="flex justify-between text-[10px] text-gray-400 font-medium">
                                    <span>${percent.toFixed(0)}% listened</span>
                                    <span>-${formatTime(remaining)} left</span>
                                </div>
                                <div class="w-full bg-gray-200 dark:bg-gray-700 h-1.5 rounded-full overflow-hidden">
                                    <div class="bg-[#4173B0] h-full transition-all duration-300" style="width: ${percent}%"></div>
                                </div>
                            </div>

                            <div class="flex items-center justify-between pt-1">
                                <button onclick="openEditModal('${item.id}')" class="text-xs text-gray-400 hover:text-[#4173B0] transition flex items-center space-x-1 p-1">
                                    <i class="fa-solid fa-pen"></i>
                                    <span>Edit</span>
                                </button>
                                <button onclick="deleteItem('${item.id}')" class="text-xs text-gray-400 hover:text-red-500 transition p-1">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function playItem(id) {
            const item = appData.items.find(i => i.id === id);
            if (!item) return;

            if (appData.currentTrackId !== id) {
                appData.currentTrackId = id;
                audioElement.src = item.audioUrl;
                audioElement.currentTime = item.currentTime || 0;
                audioElement.playbackRate = item.speed || 1.0;
                audioElement.play().catch(e => console.log("Playback error:", e));
            } else {
                if (audioElement.paused) audioElement.play();
                else audioElement.pause();
            }

            updatePlayerBarUI();
            renderItems();
        }

        function togglePlayPause() {
            if (!appData.currentTrackId) return;
            if (audioElement.paused) audioElement.play();
            else audioElement.pause();
            updatePlayerBarUI();
            renderItems();
        }

        function updateAudioProgress() {
            if (!appData.currentTrackId) return;
            const item = appData.items.find(i => i.id === appData.currentTrackId);
            if (item) {
                item.currentTime = audioElement.currentTime;
                item.duration = audioElement.duration || item.duration;
                saveAppData();

                document.getElementById('currentTimeDisplay').innerText = formatTime(audioElement.currentTime);
                document.getElementById('durationDisplay').innerText = formatTime(audioElement.duration || 0);
                
                const seek = document.getElementById('seekSlider');
                if (audioElement.duration) {
                    seek.value = (audioElement.currentTime / audioElement.duration) * 100;
                }
            }
        }

        function handleMetadataLoaded() {
            if (!appData.currentTrackId) return;
            const item = appData.items.find(i => i.id === appData.currentTrackId);
            if (item) {
                item.duration = audioElement.duration;
                document.getElementById('durationDisplay').innerText = formatTime(audioElement.duration);
                saveAppData();
            }
        }

        function seekAudio(val) {
            if (!appData.currentTrackId || !audioElement.duration) return;
            audioElement.currentTime = (val / 100) * audioElement.duration;
        }

        function skipTime(sec) {
            if (!appData.currentTrackId) return;
            audioElement.currentTime = Math.min(audioElement.duration || 0, Math.max(0, audioElement.currentTime + sec));
        }

        function adjustFileSpeed(amount) {
            if (!appData.currentTrackId) return;
            const item = appData.items.find(i => i.id === appData.currentTrackId);
            if (!item) return;

            let newSpeed = Math.round((item.speed + amount) * 10) / 10;
            if (newSpeed < 0.5) newSpeed = 0.5;
            if (newSpeed > 3.0) newSpeed = 3.0;

            item.speed = newSpeed;
            audioElement.playbackRate = newSpeed;
            document.getElementById('fileSpeedDisplay').innerText = newSpeed.toFixed(1) + 'x';
            saveAppData();
            renderItems();
            updateSlothModeState(newSpeed);
        }

        function toggleSlothMode() {
            if (!appData.currentTrackId) return;
            const item = appData.items.find(i => i.id === appData.currentTrackId);
            if (!item) return;

            if (item.speed === 0.5) {
                item.speed = 1.0;
            } else {
                item.speed = 0.5;
            }

            audioElement.playbackRate = item.speed;
            document.getElementById('fileSpeedDisplay').innerText = item.speed.toFixed(1) + 'x';
            saveAppData();
            renderItems();
            updateSlothModeState(item.speed);
        }

        function updateSlothModeState(speed) {
            const btn = document.getElementById('slothModeBtn');
            if (speed === 0.5) {
                btn.classList.add('bg-[#EB8861]', 'text-white');
                btn.classList.remove('bg-[#EABCB5]/40', 'text-[#2B4C6D]');
            } else {
                btn.classList.remove('bg-[#EB8861]', 'text-white');
                btn.classList.add('bg-[#EABCB5]/40', 'text-[#2B4C6D]');
            }
        }

        function updatePlayerBarUI() {
            const btn = document.getElementById('playPauseBtn');
            btn.disabled = false;
            const icon = btn.querySelector('i');

            if (audioElement.paused) icon.className = 'fa-solid fa-play text-base ml-0.5';
            else icon.className = 'fa-solid fa-pause text-base';

            if (appData.currentTrackId) {
                const item = appData.items.find(i => i.id === appData.currentTrackId);
                if (item) {
                    document.getElementById('currentTitle').innerText = item.title;
                    document.getElementById('currentSubtitle').innerText = `${item.folder || 'Unassigned'} • ${item.type}`;
                    document.getElementById('currentCover').src = item.coverUrl;
                    document.getElementById('fileSpeedDisplay').innerText = (item.speed || 1.0).toFixed(1) + 'x';
                    updateSlothModeState(item.speed || 1.0);
                }
            }
        }

        function handleAudioEnded() {
            updatePlayerBarUI();
            renderItems();
        }

        function openAddFeedModal() { document.getElementById('rssModal').classList.remove('hidden'); }
        function closeAddFeedModal() { document.getElementById('rssModal').classList.add('hidden'); }

        async function submitRssFeed() {
            const url = document.getElementById('rssUrlInput').value.trim();
            if (!url) return;
            
            const demoEpisodes = [
                {
                    id: 'rss-' + Date.now() + '-1',
                    title: 'Indy’s Weekly Tail-Wagging Podcast #104',
                    type: 'podcast',
                    audioUrl: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3',
                    coverUrl: 'https://images.unsplash.com/photo-1507679799987-c73779587ccf?w=300',
                    folder: 'Indy Tech',
                    currentTime: 0,
                    duration: 240,
                    speed: 1.0,
                    bookmarks: []
                }
            ];

            appData.items.unshift(...demoEpisodes);
            saveAppData();
            renderItems();
            renderFolders();
            closeAddFeedModal();
            document.getElementById('rssUrlInput').value = '';
        }

        function handleLocalUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const url = URL.createObjectURL(file);
            const cleanTitle = file.name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ");
            const lowerName = file.name.toLowerCase();
            const isBook = lowerName.endsWith('.m4b') || lowerName.includes('book') || lowerName.endsWith('.m4a');
            
            const defaultCover = isBook ? 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=300' : 'https://images.unsplash.com/photo-1516979187457-637abb4f9353?w=300';

            const newItem = {
                id: 'local-' + Date.now(),
                title: cleanTitle,
                type: isBook ? 'audiobook' : 'podcast',
                audioUrl: url,
                coverUrl: defaultCover,
                folder: isBook ? 'Audiobooks' : '',
                currentTime: 0,
                duration: 0,
                speed: 1.0,
                bookmarks: []
            };

            if (window.jsmediatags) {
                jsmediatags.read(file, {
                    onSuccess: function(tag) {
                        const tags = tag.tags;
                        if (tags.title) newItem.title = tags.title;
                        if (tags.picture) {
                            try {
                                const data = tags.picture.data;
                                const format = tags.picture.format;
                                let base64String = "";
                                for (let i = 0; i < data.length; i++) {
                                    base64String += String.fromCharCode(data[i]);
                                }
                                newItem.coverUrl = `data:${format};base64,${btoa(base64String)}`;
                                saveAppData();
                                renderItems();
                                updatePlayerBarUI();
                            } catch (e) {
                                console.log("Could not parse embedded artwork", e);
                            }
                        }
                    },
                    onError: function(error) { console.log("No embedded tags found:", error); }
                });
            }

            appData.items.unshift(newItem);
            saveAppData();
            renderItems();
            renderFolders();
            playItem(newItem.id);
            event.target.value = '';
        }

        function openEditModal(id) {
            const item = appData.items.find(i => i.id === id);
            if (!item) return;

            document.getElementById('editItemId').value = item.id;
            document.getElementById('editTitleInput').value = item.title;
            document.getElementById('editCoverInput').value = item.coverUrl;
            document.getElementById('editFolderSelect').value = item.folder || '';
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() { document.getElementById('editModal').classList.add('hidden'); }

        function saveItemEdits() {
            const id = document.getElementById('editItemId').value;
            const item = appData.items.find(i => i.id === id);
            if (!item) return;

            item.title = document.getElementById('editTitleInput').value;
            item.coverUrl = document.getElementById('editCoverInput').value || 'https://placehold.co/300x300/4173B0/ffffff?text=Indy';
            item.folder = document.getElementById('editFolderSelect').value;

            saveAppData();
            renderItems();
            renderFolders();
            updatePlayerBarUI();
            closeEditModal();
        }

        function openFolderModal() { document.getElementById('folderModal').classList.remove('hidden'); }
        function closeFolderModal() { document.getElementById('folderModal').classList.add('hidden'); }

        function createNewFolder() {
            const name = document.getElementById('newFolderNameInput').value.trim();
            if (!name || appData.folders.includes(name)) return;

            appData.folders.push(name);
            saveAppData();
            renderFolders();
            updateFolderDropdowns();
            closeFolderModal();
            document.getElementById('newFolderNameInput').value = '';
        }

        function deleteItem(id) {
            appData.items = appData.items.filter(i => i.id !== id);
            if (appData.currentTrackId === id) {
                audioElement.pause();
                appData.currentTrackId = null;
                updatePlayerBarUI();
            }
            saveAppData();
            renderItems();
            renderFolders();
        }

        function openSleepModal() { document.getElementById('sleepModal').classList.remove('hidden'); }
        function closeSleepModal() { document.getElementById('sleepModal').classList.add('hidden'); }

        function setSleepTimer(minutes) {
            if (sleepTimerInterval) clearInterval(sleepTimerInterval);
            const badge = document.getElementById('sleepBadge');

            if (minutes === 0) {
                sleepTimeRemaining = 0;
                badge.classList.add('hidden');
                closeSleepModal();
                return;
            }

            sleepTimeRemaining = minutes * 60;
            badge.innerText = minutes + 'm';
            badge.classList.remove('hidden');

            sleepTimerInterval = setInterval(() => {
                sleepTimeRemaining--;
                const currentMin = Math.ceil(sleepTimeRemaining / 60);
                badge.innerText = currentMin + 'm';

                if (sleepTimeRemaining <= 0) {
                    clearInterval(sleepTimerInterval);
                    audioElement.pause();
                    badge.classList.add('hidden');
                    updatePlayerBarUI();
                    renderItems();
                }
            }, 1000);

            closeSleepModal();
        }

        function addCurrentBookmark() {
            if (!appData.currentTrackId) return;
            const item = appData.items.find(i => i.id === appData.currentTrackId);
            if (!item) return;

            const time = audioElement.currentTime;
            item.bookmarks.push({
                time: time,
                formattedTime: formatTime(time),
                date: new Date().toLocaleDateString()
            });

            saveAppData();
        }

        function openBookmarksModal() {
            if (!appData.currentTrackId) return;
            const item = appData.items.find(i => i.id === appData.currentTrackId);
            const container = document.getElementById('bookmarksList');

            if (!item.bookmarks || item.bookmarks.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-400 text-center py-6">No bookmarks saved for this item yet.</p>`;
            } else {
                container.innerHTML = item.bookmarks.map((b, idx) => `
                    <div class="flex items-center justify-between p-3 bg-gray-50 dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-700/60">
                        <div>
                            <button onclick="audioElement.currentTime = ${b.time}; closeBookmarksModal();" class="font-semibold text-sm text-[#4173B0] hover:underline">
                                Bookmark at ${b.formattedTime}
                            </button>
                            <p class="text-[11px] text-gray-400">${b.date}</p>
                        </div>
                        <button onclick="deleteBookmark('${item.id}', ${idx})" class="text-gray-400 hover:text-red-500 text-xs"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `).join('');
            }

            document.getElementById('bookmarksModal').classList.remove('hidden');
        }

        function closeBookmarksModal() { document.getElementById('bookmarksModal').classList.add('hidden'); }

        function deleteBookmark(itemId, index) {
            const item = appData.items.find(i => i.id === itemId);
            if (!item) return;
            item.bookmarks.splice(index, 1);
            saveAppData();
            openBookmarksModal();
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }
    </script>
</body>
</html>
